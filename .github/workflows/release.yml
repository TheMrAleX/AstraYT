name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión semántica, sin v; vacío incrementa el parche publicado'
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        required: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          export LATEST_TAG
          LATEST_TAG=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // "v0.0.0"')
          python3 - <<'PYTHON'
          import os, re
          requested = os.environ.get('REQUESTED_VERSION', '').strip()
          latest = os.environ['LATEST_TAG'].removeprefix('v')
          if not re.fullmatch(r'\d+\.\d+\.\d+', latest):
              raise SystemExit('La última release no tiene una versión semántica válida')
          previous = tuple(map(int, latest.split('.')))
          if requested:
              if not re.fullmatch(r'\d+\.\d+\.\d+', requested):
                  raise SystemExit('Versión inválida: se espera major.minor.patch')
              parts = tuple(map(int, requested.split('.')))
              if parts <= previous:
                  raise SystemExit('La versión debe ser mayor que la última release publicada')
          else:
              parts = (*previous[:2], previous[2] + 1)
          major, minor, patch = parts
          code = major * 1_000_000 + minor * 10_000 + patch
          if minor >= 100 or patch >= 10_000 or not 1 <= code <= 2_100_000_000:
              raise SystemExit('Versión fuera del rango de versionCode admitido')
          version = '.'.join(map(str, parts))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ncode={code}\n')
          PYTHON
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          ENTRY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/astrayt-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
            test -n "$STORE_PASSWORD" && test -n "$STORE_ALIAS" && test -n "$ENTRY_PASSWORD"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            ENTRY_PASSWORD="$STORE_PASSWORD"
            STORE_ALIAS=astrayt
            echo "::add-mask::$STORE_PASSWORD"
            keytool -genkeypair -keystore "$key_path" -storetype PKCS12 -alias "$STORE_ALIAS" -storepass:env STORE_PASSWORD -keypass:env ENTRY_PASSWORD -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=AstraYT Temporary Release'
            echo '⚠️ Firma temporal: esta APK no será compatible para actualizar instalaciones firmadas por otras ejecuciones. Configura los cuatro secretos para conservar la firma.' >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "KEYSTORE_PATH=$key_path"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$STORE_ALIAS"
            echo "KEY_PASSWORD=$ENTRY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Test and assemble release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CODE: ${{ steps.release.outputs.code }}
        run: ./gradlew testReleaseUnitTest assembleRelease -PappVersionCode="$RELEASE_CODE" -PappVersionName="$RELEASE_VERSION"
      - name: Publish ARM64 and ARMv7 APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          assets=()
          for abi in arm64-v8a armeabi-v7a; do
            apk="AstraYT-v$RELEASE_VERSION-$abi.apk"
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "$apk"
            sha256sum "$apk" > "$apk.sha256"
            assets+=("$apk" "$apk.sha256")
          done
          gh release create "v$RELEASE_VERSION" "${assets[@]}" --target "$GITHUB_SHA" --title "AstraYT $RELEASE_VERSION" --generate-notes --latest
