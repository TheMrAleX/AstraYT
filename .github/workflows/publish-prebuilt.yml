name: Publish verified APKs
on:
  push:
    branches: ['release-assets/*']
  workflow_dispatch:
    inputs:
      artifact_ref:
        description: 'Commit de la rama temporal con los APKs verificados'
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: publish-prebuilt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.artifact_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate staged files
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re
          meta = json.loads(pathlib.Path('RELEASE.json').read_text())
          tag = meta['tag']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Tag inválido')
          if not re.fullmatch(r'[0-9a-f]{40}', meta['source_commit']):
              raise SystemExit('Commit de fuente inválido')
          expected = {
              f'AstraYT-{tag}-{abi}.apk{suffix}'
              for abi in ('arm64-v8a', 'armeabi-v7a')
              for suffix in ('', '.sha256')
          }
          checksums = {}
          for line in pathlib.Path('SHA256SUMS').read_text().splitlines():
              digest, name = line.split('  ', 1)
              if name not in expected or name in checksums or not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise SystemExit('Manifiesto inválido')
              checksums[name] = digest
          if set(checksums) != expected:
              raise SystemExit('Faltan artefactos')
          for name, digest in checksums.items():
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'Checksum incorrecto: {name}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PYTHON
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify update signatures
        shell: bash
        run: |
          set -euo pipefail
          tools_archive="$RUNNER_TEMP/android-build-tools-36.zip"
          curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/repository/build-tools_r36_linux.zip --output "$tools_archive"
          printf '%s  %s\n' 5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b "$tools_archive" | sha256sum -c -
          signer="$RUNNER_TEMP/apksigner.jar"
          unzip -p "$tools_archive" android-16/lib/apksigner.jar > "$signer"
          expected=c4a7fec889a3550494efea270d3e3c8a76219792d11f41e12946f2e8a04763df
          tag=$(python3 -c 'import json; print(json.load(open("RELEASE.json"))["tag"])')
          for abi in arm64-v8a armeabi-v7a; do
            report="$RUNNER_TEMP/signature-$abi.txt"
            if ! java -jar "$signer" verify --print-certs "AstraYT-$tag-$abi.apk" > "$report"; then
              echo "::error::No se pudo verificar la firma de $abi"
              exit 1
            fi
            certificate=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$report")
            if [ "$certificate" != "$expected" ]; then
              echo "::error::El certificado de $abi no coincide con la firma original: $certificate"
              exit 1
            fi
          done
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(python3 -c 'import json; print(json.load(open("RELEASE.json"))["source_commit"])')
          if ! git cat-file -e "$source_commit^{commit}"; then
            echo "::error::No está disponible el commit fuente $source_commit en el checkout"
            exit 1
          fi
          tag_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          if [ "$tag_commit" != "$source_commit" ]; then
            echo "::error::El tag no coincide con el commit fuente verificado"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            python3 - <<'PYTHON'
          import json, os, pathlib
          meta = json.loads(pathlib.Path('RELEASE.json').read_text())
          pathlib.Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(meta.get('notes', ''))
          PYTHON
            if ! gh release create "$RELEASE_TAG" --verify-tag --draft --title "AstraYT ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md" 2> "$RUNNER_TEMP/release-error.txt"; then
              python3 - <<'PYTHON'
          import os, pathlib
          message = pathlib.Path(os.environ['RUNNER_TEMP'], 'release-error.txt').read_text()
          token = os.environ.get('GH_TOKEN', '')
          if token:
              message = message.replace(token, '[redacted]')
          print('::error::' + message[:1500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYTHON
              exit 1
            fi
          fi
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::La release $RELEASE_TAG no es un borrador: $draft"
            exit 1
          fi
      - name: Upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          for abi in arm64-v8a armeabi-v7a; do
            apk="AstraYT-$RELEASE_TAG-$abi.apk"
            assets+=("$apk" "$apk.sha256")
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
      - name: Verify uploaded checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/verify-release"
          mkdir -p "$verify_dir"
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c "$GITHUB_WORKSPACE/SHA256SUMS")
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest
